# Endpoint monitoring stack: blackbox_exporter -> Prometheus -> Grafana,
# plus mock application servers so the demo works on any laptop.
services:
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./blackbox:/etc/blackbox:ro
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports: ["9090:9090"]
    depends_on: [blackbox-exporter]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/app-monitoring-overview.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["3000:3000"]
    depends_on: [prometheus]
    restart: unless-stopped

  # ---- mock application servers (remove this block when pointing at real apps) ----
  app-portal:      &mock
    build: ./mock
    environment: { MODE: ok, APP_NAME: portal }
    profiles: ["demo"]
  app-payments:
    <<: *mock
    environment: { MODE: slow, APP_NAME: payments, SLOW_SECONDS: "1.5" }
  app-registry:
    <<: *mock
    environment: { MODE: error, APP_NAME: registry }
  app-reports:
    <<: *mock
    environment: { MODE: flaky, APP_NAME: reports, FLAKY_RATE: "0.4" }
  app-portal-stg:
    <<: *mock
    environment: { MODE: ok, APP_NAME: portal-staging }
  # app-unreachable is intentionally not defined: it shows how a DNS/firewall failure looks.

volumes:
  prometheus-data:
  grafana-data:
